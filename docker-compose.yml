# ============================================================================
#  AulaFix · docker-compose.yml
# ============================================================================
#  Levanta el entorno completo (PHP 8.3 + Apache en public/, MySQL 8 y phpMyAdmin).
#  Uso:
#    1. docker compose up -d --build
#    2. docker compose exec app php database/instalar.php
#    3. Abrir http://localhost:8080 (y phpMyAdmin en http://localhost:8081)
# ============================================================================

services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      # En Docker el host de MySQL es el nombre del servicio ("db")
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: aulafix
      DB_USER: aulafix
      DB_PASS: aulafix
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_aulafix
      MYSQL_DATABASE: aulafix
      MYSQL_USER: aulafix
      MYSQL_PASSWORD: aulafix
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_aulafix"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
