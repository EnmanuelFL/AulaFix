#          y justifica la elección de tecnologías en el README)
#
#  ¿QUÉ ES ESTE FICHERO?
#  Define la orquestación de contenedores para desplegar el entorno completo
#  de AulaFix sin necesidad de instalar PHP ni MySQL manualmente en el host:
#    1. Servicio Web / PHP 8.3 (con Apache o CLI y extensión pdo_mysql).
#    2. Servicio Base de Datos MySQL 8.0 (con volumen persistente).
#    3. Servicio phpMyAdmin (interfaz web gráfica para administrar la BD).
#
# ----------------------------------------------------------------------------
#  REQUISITOS (según el enunciado y la rúbrica)
# ----------------------------------------------------------------------------
#  [ ] Versión de PHP: 8.3.
#  [ ] Versión de MySQL: 8.0 (con motor InnoDB y soporte utf8mb4).
#  [ ] DocumentRoot del servidor web apuntando a la carpeta /public.
#      (Principio de seguridad: config.php, includes/ y database/ NO deben ser
#      accesibles directamente desde la URL del navegador).
#  [ ] Comunicación interna: la aplicación PHP debe conectarse a MySQL
#      usando el nombre del servicio (por ejemplo host: "db"), que se pasa
#      por variable de entorno (DB_HOST=db).
#  [ ] Persistencia: el volumen de MySQL debe evitar que los datos se borren
#      al reiniciar los contenedores.
#
# ----------------------------------------------------------------------------
#  ESTRUCTURA DE REFERENCIA (Plantilla comentada para que la completéis)
# ----------------------------------------------------------------------------
#
