#        - db
#
#  volumes:
#    db_data:
#
# ----------------------------------------------------------------------------
#  COMANDOS ÚTILES PARA LA TERMINAL
# ----------------------------------------------------------------------------
#  - Levantar contenedores:
#      docker compose up -d
#  - Ver estado de los contenedores:
#      docker compose ps
#  - Ejecutar el script de instalación de la BD dentro del contenedor:
#      docker compose exec app php database/instalar.php
#  - Ver logs en tiempo real:
#      docker compose logs -f app
#  - Parar contenedores:
#      docker compose down
#
# ----------------------------------------------------------------------------
#  PISTAS
# ----------------------------------------------------------------------------
#  - Extensión PDO MySQL: La imagen oficial `php:8.3-apache` no trae activo el
#    driver `pdo_mysql` por defecto. Podéis usar un `Dockerfile` sencillo
#    con `RUN docker-php-ext-install pdo_mysql` o configurarlo con un script.
#  - DocumentRoot de Apache: Por defecto apunta a `/var/www/html`. Para que apunte
#    a `/var/www/html/public`, se puede cambiar la variable de entorno
#    `APACHE_DOCUMENT_ROOT=/var/www/html/public` o modificar el VirtualHost.
#
# ----------------------------------------------------------------------------
#  TECNOLOGÍAS Y CONCEPTOS PARA INVESTIGAR
